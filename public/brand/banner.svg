      <stop offset="0.42" stop-color="#2f1a52"/>
      <stop offset="0.72" stop-color="#432665"/>
      <stop offset="1" stop-color="#12071f"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.68" cy="0.28" r="0.52">
